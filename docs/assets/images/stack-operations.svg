<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="monospace" font-size="14">
  <rect width="800" height="400" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" fill="#cdd6f4" font-size="18" font-weight="bold" text-anchor="middle">Stack — LIFO Operations</text>

  <!-- Stack frame -->
  <rect x="100" y="60" width="160" height="280" rx="4" fill="none" stroke="#585b70" stroke-width="2"/>
  <text x="180" y="355" fill="#6c7086" font-size="12" text-anchor="middle">BOTTOM</text>
  <text x="180" y="72" fill="#89b4fa" font-size="12" text-anchor="middle">TOP ↓</text>

  <!-- Stack elements (filled state: [1, 2, 3]) -->
  <rect x="108" y="230" width="144" height="40" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="180" y="256" fill="#89b4fa" text-anchor="middle">1</text>
  <rect x="108" y="186" width="144" height="40" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="180" y="211" fill="#89b4fa" text-anchor="middle">2</text>
  <rect x="108" y="142" width="144" height="40" rx="4" fill="#a6e3a1" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="180" y="167" fill="#1e1e2e" font-weight="bold" text-anchor="middle">3  ← TOP</text>

  <!-- Operations -->
  <text x="330" y="85" fill="#f9e2af" font-size="15" font-weight="bold">Operations</text>

  <!-- push -->
  <rect x="330" y="100" width="200" height="55" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="430" y="122" fill="#a6e3a1" font-weight="bold" text-anchor="middle">push(x)</text>
  <text x="340" y="142" fill="#cdd6f4" font-size="12">Add x to top — O(1)</text>

  <!-- pop -->
  <rect x="330" y="168" width="200" height="55" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="430" y="190" fill="#f38ba8" font-weight="bold" text-anchor="middle">pop()</text>
  <text x="340" y="210" fill="#cdd6f4" font-size="12">Remove + return top — O(1)</text>

  <!-- peek -->
  <rect x="330" y="236" width="200" height="55" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="430" y="258" fill="#89b4fa" font-weight="bold" text-anchor="middle">peek()</text>
  <text x="340" y="278" fill="#cdd6f4" font-size="12">Read top without remove — O(1)</text>

  <!-- Applications -->
  <rect x="580" y="85" width="200" height="285" rx="8" fill="#313244" stroke="#fab387" stroke-width="1.5"/>
  <text x="680" y="107" fill="#fab387" font-size="14" font-weight="bold" text-anchor="middle">Applications</text>
  <text x="592" y="130" fill="#cdd6f4" font-size="12">✓ Valid Parentheses</text>
  <text x="592" y="153" fill="#cdd6f4" font-size="12">✓ Undo / Redo</text>
  <text x="592" y="176" fill="#cdd6f4" font-size="12">✓ Browser History</text>
  <text x="592" y="199" fill="#cdd6f4" font-size="12">✓ Expression Eval</text>
  <text x="592" y="222" fill="#cdd6f4" font-size="12">✓ Iterative DFS</text>
  <text x="592" y="245" fill="#cdd6f4" font-size="12">✓ Monotonic Stack</text>
  <text x="592" y="268" fill="#cdd6f4" font-size="12">✓ Call Stack (OS)</text>

  <!-- JS impl note -->
  <rect x="330" y="305" width="200" height="65" rx="6" fill="#181825" stroke="#585b70" stroke-width="1"/>
  <text x="430" y="325" fill="#6c7086" font-size="12" text-anchor="middle">JavaScript</text>
  <text x="340" y="345" fill="#cdd6f4" font-size="12">const stack = [];</text>
  <text x="340" y="362" fill="#a6e3a1" font-size="12">stack.push(x);  // O(1)</text>
  <text x="340" y="379" fill="#f38ba8" font-size="12">stack.pop();    // O(1)</text>
</svg>
