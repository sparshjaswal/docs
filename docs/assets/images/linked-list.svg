<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="600" height="140" font-family="Segoe UI, Arial">
  <style>
    .bg { fill:#0f172a; }
    .node { fill:#c2410c; stroke:#fb923c; }
    text, .val, .title, .caption { fill:#ffffff; }
    .val { font-size:14px; font-weight:600; }
    .title { font-size:16px; font-weight:600; }
    .caption { font-size:12px; opacity:0.85; }
  </style>
  <rect class="bg" x="0" y="0" width="600" height="140" rx="8"/>
  <text x="16" y="28" class="title">Singly Linked List</text>
  <text x="16" y="46" class="caption">O(1) insert/delete with node ref · O(n) search/index · Sequential traversal</text>
  <g transform="translate(16,66)">
    <rect class="node" x="0" y="0" width="80" height="40" rx="6"/>
    <rect class="node" x="120" y="0" width="80" height="40" rx="6"/>
    <rect class="node" x="240" y="0" width="80" height="40" rx="6"/>
    <rect class="node" x="360" y="0" width="80" height="40" rx="6"/>
    <text class="val" x="40" y="25" text-anchor="middle">1</text>
    <text class="val" x="160" y="25" text-anchor="middle">2</text>
    <text class="val" x="280" y="25" text-anchor="middle">3</text>
    <text class="val" x="400" y="25" text-anchor="middle">4</text>
    <path d="M80 20 L110 20" stroke="#fb923c" marker-end="url(#arrow)" stroke-width="2"/>
    <path d="M200 20 L230 20" stroke="#fb923c" marker-end="url(#arrow)" stroke-width="2"/>
    <path d="M320 20 L350 20" stroke="#fb923c" marker-end="url(#arrow)" stroke-width="2"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fb923c" /></marker>
  </defs>
  <text x="460" y="92" font-size="12">null</text>
  <text x="16" y="124" font-size="12">No random access; beware cycle creation</text>
</svg>