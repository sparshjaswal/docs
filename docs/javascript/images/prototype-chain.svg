<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" role="img" aria-labelledby="title desc">
<title id="title">An instance prototype chain</title><desc id="desc">An ordinary property is searched on the instance, then Wallet.prototype, then Object.prototype, ending at null. Private fields do not use ordinary property lookup.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#47657a" stroke-width="1.5"/></marker></defs>
<rect width="640" height="660" rx="20" fill="#f2f7fa"/>
<g font-family="system-ui, -apple-system, sans-serif" fill="#13334a"><text x="32" y="45" font-size="24" font-weight="700" fill="#13334a">HOW PROPERTY LOOKUP WORKS</text><text x="32" y="77" font-size="21" font-weight="400" fill="#13334a">Read wallet.deposit: search until a match.</text><rect x="30" y="101" width="580" height="105" rx="12" fill="#fff" stroke="#c6d6e0" stroke-width="2"/><text x="50" y="132" font-size="24" font-weight="700" fill="#13334a">wallet (instance)</text><text x="50" y="163" font-size="21" font-weight="400" fill="#13334a">Own state: owner = &quot;Asha&quot;</text><text x="50" y="189" font-size="19" font-weight="400" fill="#13334a">Private fields use separate access rules.</text><path d="M64 212 L64 239" fill="none" stroke="#47657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="85" y="232" font-size="18" font-weight="400" fill="#47657a">[[Prototype]]</text><rect x="30" y="243" width="580" height="105" rx="12" fill="#e3f5ec" stroke="#c6d6e0" stroke-width="2"/><text x="50" y="274" font-size="24" font-weight="700" fill="#13334a">Wallet.prototype</text><text x="50" y="305" font-size="21" font-weight="400" fill="#13334a">deposit(amount)  ← method found</text><text x="50" y="331" font-size="19" font-weight="400" fill="#13334a">Shared by instances created with new Wallet.</text><path d="M64 354 L64 381" fill="none" stroke="#47657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="85" y="374" font-size="18" font-weight="400" fill="#47657a">[[Prototype]]</text><rect x="30" y="385" width="580" height="105" rx="12" fill="#fff" stroke="#c6d6e0" stroke-width="2"/><text x="50" y="416" font-size="24" font-weight="700" fill="#13334a">Object.prototype</text><text x="50" y="447" font-size="21" font-weight="400" fill="#13334a">Inherited methods such as toString</text><text x="50" y="473" font-size="19" font-weight="400" fill="#13334a">The chain continues when no match is found.</text><path d="M64 496 L64 523" fill="none" stroke="#47657a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="85" y="516" font-size="18" font-weight="400" fill="#47657a">[[Prototype]]</text><rect x="30" y="527" width="580" height="105" rx="12" fill="#fff" stroke="#c6d6e0" stroke-width="2"/><text x="50" y="558" font-size="24" font-weight="700" fill="#13334a">null</text><text x="50" y="589" font-size="21" font-weight="400" fill="#13334a">End of the prototype chain</text><text x="50" y="615" font-size="19" font-weight="400" fill="#13334a">A missing ordinary property reads undefined.</text></g></svg>