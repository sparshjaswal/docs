<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" width="760" height="140" role="img" aria-label="Sliding window over array showing left and right pointers">
  <style>
    .label{font:14px Inter,Arial,sans-serif;fill:#222}
    .cell{stroke:#1976d2;stroke-width:1.4;fill:#f5faff}
    .win{stroke:#e53935;stroke-width:2;fill:rgba(229,57,53,0.08)}
    .ptr{font:12px Inter,Arial,sans-serif;fill:#e53935}
  </style>
  <text x="20" y="22" class="label">Sliding Window</text>
  <g transform="translate(20,30)">
    <!-- array cells -->
    <g>
      <rect class="cell" x="0" y="0" width="60" height="34"/>
      <rect class="cell" x="70" y="0" width="60" height="34"/>
      <rect class="cell" x="140" y="0" width="60" height="34"/>
      <rect class="cell" x="210" y="0" width="60" height="34"/>
      <rect class="cell" x="280" y="0" width="60" height="34"/>
      <rect class="cell" x="350" y="0" width="60" height="34"/>
      <rect class="cell" x="420" y="0" width="60" height="34"/>
    </g>
    <g>
      <text x="30" y="22" text-anchor="middle" class="label">1</text>
      <text x="100" y="22" text-anchor="middle" class="label">3</text>
      <text x="170" y="22" text-anchor="middle" class="label">2</text>
      <text x="240" y="22" text-anchor="middle" class="label">5</text>
      <text x="310" y="22" text-anchor="middle" class="label">2</text>
      <text x="380" y="22" text-anchor="middle" class="label">9</text>
      <text x="450" y="22" text-anchor="middle" class="label">7</text>
    </g>
    <rect class="win" x="70" y="-8" width="200" height="50" rx="6"/>
    <text x="70" y="-16" class="ptr">L</text>
    <text x="270" y="-16" class="ptr" text-anchor="end">R</text>
  </g>
  <text x="20" y="110" class="label">Expand R → condition violated → move L → update best</text>
</svg>
