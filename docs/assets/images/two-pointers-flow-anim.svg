<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200" role="img" aria-labelledby="tpTitle tpDesc" aria-describedby="tpLegend" shape-rendering="crispEdges">
  <title id="tpTitle">Two Pointers</title>
  <desc id="tpDesc">Compare ends; move inward until meet.</desc>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --cell-border:#334155; --text:#ffffff; --caption:#94a3b8; --left:#38bdf8; --right:#f472b6; --p1:#6366f1; --p2:#f472b6; --p3:#facc15; --p4:#10b981; --p5:#14b8a6; }
    text{font-family:Inter,Arial,sans-serif}
    .title{font-size:15px;font-weight:600;fill:var(--text)}
    .caption{font-size:12px;fill:var(--caption)}
    .cell{stroke:var(--cell-border);stroke-width:1.1;fill:var(--panel);rx:4}
    .val{font-size:13px;font-weight:500;fill:var(--text)}
    .step{font-size:11px;font-weight:600;fill:var(--caption)}
    @media (prefers-reduced-motion: reduce){ .anim{display:none} .fallback{display:block} }
    .fallback{display:none}
  </style>
  <rect x="0" y="0" width="780" height="200" fill="var(--bg)" />
  <rect x="0" y="0" width="780" height="54" fill="#1e293b" />
  <text x="20" y="24" class="title">Two Pointers</text>
  <text x="20" y="42" class="caption" id="tpLegend">Advance inward comparing; stop when l ≥ r.</text>
  <g transform="translate(20,80)">
    <rect class="cell" x="0" y="0" width="60" height="40"/>
    <rect class="cell" x="70" y="0" width="60" height="40"/>
    <rect class="cell" x="140" y="0" width="60" height="40"/>
    <rect class="cell" x="210" y="0" width="60" height="40"/>
    <rect class="cell" x="280" y="0" width="60" height="40"/>
    <rect class="cell" x="350" y="0" width="60" height="40"/>
    <rect class="cell" x="420" y="0" width="60" height="40"/>
    <text class="val" x="30" y="24" text-anchor="middle">1</text>
    <text class="val" x="100" y="24" text-anchor="middle">3</text>
    <text class="val" x="170" y="24" text-anchor="middle">5</text>
    <text class="val" x="240" y="24" text-anchor="middle">7</text>
    <text class="val" x="310" y="24" text-anchor="middle">9</text>
    <text class="val" x="380" y="24" text-anchor="middle">11</text>
    <text class="val" x="450" y="24" text-anchor="middle">13</text>
    <!-- l pointer animation -->
    <text id="lptr" class="anim" x="0" y="-12" fill="#38bdf8">l
      <animate attributeName="x" dur="8s" repeatCount="indefinite" values="0;0;70;140;210;0" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </text>
    <!-- r pointer animation -->
    <text id="rptr" class="anim" x="420" y="-12" fill="#f472b6">r
      <animate attributeName="x" dur="8s" repeatCount="indefinite" values="420;420;350;280;210;420" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </text>
    <!-- Compare highlight bar -->
    <rect class="anim" x="0" y="48" width="60" height="6" fill="#38bdf8" opacity="0">
      <animate attributeName="x" dur="8s" repeatCount="indefinite" values="0;0;70;140;210;0" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;1;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </rect>
    <rect class="anim" x="420" y="48" width="60" height="6" fill="#f472b6" opacity="0">
      <animate attributeName="x" dur="8s" repeatCount="indefinite" values="420;420;350;280;210;420" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;1;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </rect>
    <!-- Step counter -->
    <rect id="phaseBox" class="anim" x="520" y="-32" width="120" height="32" rx="6" fill="var(--p1)" stroke="var(--cell-border)">
      <animate attributeName="fill" dur="8s" repeatCount="indefinite" values="var(--p1);var(--p1);var(--p2);var(--p3);var(--p4);var(--p5)" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </rect>
    <text x="580" y="-12" text-anchor="middle" class="step anim">Compare
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </text>
    <text x="580" y="-12" text-anchor="middle" class="step anim" opacity="0">Advance l
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </text>
    <text x="580" y="-12" text-anchor="middle" class="step anim" opacity="0">Advance r
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </text>
    <text x="580" y="-12" text-anchor="middle" class="step anim" opacity="0">Evaluate
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </text>
    <text x="580" y="-12" text-anchor="middle" class="step anim" opacity="0">Loop
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </text>
    <!-- Recognition labels -->
    <text x="0" y="70" class="caption anim" opacity="1">Phase 1: compare ends
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </text>
    <text x="0" y="70" class="caption anim" opacity="0">Phase 2: move left pointer
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </text>
    <text x="0" y="70" class="caption anim" opacity="0">Phase 3: move right pointer
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </text>
    <text x="0" y="70" class="caption anim" opacity="0">Phase 4: evaluate pair
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </text>
    <text x="0" y="70" class="caption anim" opacity="0">Phase 5: loop continue
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1"/>
    </text>
  </g>
  <!-- Legend -->
  <text x="470" y="42" class="caption" id="tpLegend">
    <tspan x="470" dy="0">Legend:</tspan>
    <tspan x="470" dy="14" fill="#38bdf8">l</tspan>
    <tspan dx="8" fill="#f472b6">r</tspan>
    <tspan dx="8" fill="#94a3b8">compare</tspan>
  </text>
  <!-- Reduced motion fallback (final meeting state) -->
  <g class="fallback" transform="translate(20,80)">
    <rect class="cell" x="0" y="0" width="60" height="40"/>
    <rect class="cell" x="70" y="0" width="60" height="40"/>
    <rect class="cell" x="140" y="0" width="60" height="40"/>
    <rect class="cell" x="210" y="0" width="60" height="40"/>
    <rect class="cell" x="280" y="0" width="60" height="40"/>
    <rect class="cell" x="350" y="0" width="60" height="40"/>
    <rect class="cell" x="420" y="0" width="60" height="40"/>
    <text class="val" x="30" y="24" text-anchor="middle">1</text>
    <text class="val" x="100" y="24" text-anchor="middle">3</text>
    <text class="val" x="170" y="24" text-anchor="middle">5</text>
    <text class="val" x="240" y="24" text-anchor="middle">7</text>
    <text class="val" x="310" y="24" text-anchor="middle">9</text>
    <text class="val" x="380" y="24" text-anchor="middle">11</text>
    <text class="val" x="450" y="24" text-anchor="middle">13</text>
    <text x="210" y="-12" fill="#38bdf8" class="step">l</text>
    <text x="210" y="48" fill="#f472b6" class="step">r</text>
  </g>
  <text x="20" y="188" class="caption">Equal phases: compare → advance l → advance r → evaluate → loop.</text>
</svg>
