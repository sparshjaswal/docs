name: CI/CD - Fast Test and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: |
            **/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (with lockfile)
        if: hashFiles('**/yarn.lock') != ''
        run: yarn install --immutable

      - name: Install dependencies (no lockfile)
        if: hashFiles('**/yarn.lock') == ''
        run: yarn install

      - name: Typecheck
        run: yarn typecheck

      - name: Generate problem pages
        run: yarn generate:problems

      - name: Build site
        run: yarn build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Upload Pages artifact from build job (single upload, consumed by deploy job)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4