<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-labelledby="bsTitle bsDesc">
	<title id="bsTitle">Binary Search Answer Space</title>
	<desc id="bsDesc">Displays shrinking interval [lo, hi] and mid pivot for monotonic feasibility search.</desc>
	<style>
		:root { --bg:#ffffff; --frame:#334155; --range:#c7d2fe; --mid:#0d9488; --text:#0f172a; --note:#0d9488; }
		@media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --frame:#475569; --range:#312e81; --mid:#14b8a6; --text:#f1f5f9; --note:#14b8a6; } }
		text { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:14px; fill:var(--text); }
		.small { font-size:12px; }
		.frame { fill:var(--bg); stroke:var(--frame); }
		.interval rect { fill:var(--range); rx:6; }
		.mid line { stroke:var(--mid); stroke-width:3; stroke-dasharray:6 4; }
		.label { font-weight:600; }
		.note { fill:var(--note); font-size:12px; }
	</style>
	<rect class="frame" x="10" y="10" width="740" height="180" rx="8" />
	<!-- Normalized with viewBox for consistent sizing -->
	<text x="24" y="36" class="label">Binary Search (Answer Space)</text>
	<text x="24" y="56" class="small">Find minimal feasible value: while lo &lt; hi</text>
	<g class="interval" transform="translate(24,90)">
		<rect width="600" height="40" />
		<text x="0" y="-6">lo</text>
		<text x="600" y="-6" text-anchor="end">hi</text>
	</g>
	<g class="mid" transform="translate(24,90)">
		<line x1="300" y1="0" x2="300" y2="40" />
		<text x="300" y="60" text-anchor="middle">mid=(lo+hi)//2</text>
	</g>
	<text x="640" y="108" class="note">Halves each step</text>
	<text x="640" y="128" class="note">Loop ends lo==hi</text>
	<text x="640" y="148" class="note">Requires monotonicity</text>
</svg>