<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" role="img" aria-labelledby="psTitle psDesc" aria-describedby="psLegend" shape-rendering="crispEdges">
  <title id="psTitle">Prefix Sums</title>
  <desc id="psDesc">Cursor builds P; each completed prefix highlights.</desc>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --cell-border:#334155; --text:#ffffff; --caption:#94a3b8; --cursor:#facc15; --prefix:#8b5cf6; --p1:#6366f1; --p2:#f472b6; --p3:#facc15; --p4:#10b981; --p5:#14b8a6; --p6:#8b5cf6; }
    text{font-family:Inter,Arial,sans-serif}
    .title{font-size:15px;font-weight:600;fill:var(--text)}
    .caption{font-size:12px;fill:var(--caption)}
    .cell{stroke:var(--cell-border);stroke-width:1.1;fill:var(--panel);rx:4}
    .val{font-size:13px;font-weight:500;fill:var(--text)}
    .step{font-size:11px;font-weight:600;fill:var(--caption)}
    @media (prefers-reduced-motion: reduce){ .anim{display:none} .fallback{display:block} }
    .fallback{display:none}
  </style>
  <rect x="0" y="0" width="840" height="220" fill="var(--bg)" />
  <rect x="0" y="0" width="840" height="54" fill="#1e293b" />
  <text x="20" y="26" class="title">Prefix Sums</text>
  <text x="20" y="44" class="caption" id="psLegend">P[i+1] = P[i] + A[i]; range(l,r)=P[r+1]-P[l].</text>
  <!-- Source A -->
  <g transform="translate(20,80)">
    <rect class="cell" x="0" y="0" width="60" height="40"/>
    <rect class="cell" x="70" y="0" width="60" height="40"/>
    <rect class="cell" x="140" y="0" width="60" height="40"/>
    <rect class="cell" x="210" y="0" width="60" height="40"/>
    <rect class="cell" x="280" y="0" width="60" height="40"/>
    <text class="val" x="30" y="24" text-anchor="middle">2</text>
    <text class="val" x="100" y="24" text-anchor="middle">-1</text>
    <text class="val" x="170" y="24" text-anchor="middle">3</text>
    <text class="val" x="240" y="24" text-anchor="middle">5</text>
    <text class="val" x="310" y="24" text-anchor="middle">4</text>
    <!-- Cursor highlight -->
    <rect id="cursor" class="anim" x="0" y="0" width="60" height="40" rx="4" fill="none" stroke="var(--cursor)" stroke-width="2" opacity="1">
      <animate attributeName="x" dur="8s" repeatCount="indefinite" values="0;0;70;140;210;280;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </rect>
    <!-- Step counter -->
    <rect id="phaseBox" class="anim" x="380" y="-46" width="160" height="34" rx="6" fill="var(--p1)" stroke="var(--cell-border)">
      <animate attributeName="fill" dur="8s" repeatCount="indefinite" values="var(--p1);var(--p1);var(--p2);var(--p3);var(--p4);var(--p5);var(--p6)" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </rect>
    <text x="460" y="-26" text-anchor="middle" class="step anim">Build P[1]
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0;0;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </text>
    <text x="460" y="-26" text-anchor="middle" class="step anim" opacity="0">Build P[2]
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;0;0;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </text>
    <text x="460" y="-26" text-anchor="middle" class="step anim" opacity="0">Build P[3]
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;1;0;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </text>
    <text x="460" y="-26" text-anchor="middle" class="step anim" opacity="0">Build P[4]
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;0;1;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </text>
    <text x="460" y="-26" text-anchor="middle" class="step anim" opacity="0">Build P[5]
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;0;0;1;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </text>
    <text x="460" y="-26" text-anchor="middle" class="step anim" opacity="0">Loop
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;0;0;0;1" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </text>
    <!-- Recognition labels -->
    <text x="0" y="70" class="caption anim" opacity="1">Phase 1: compute P[1]
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0;0;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </text>
    <text x="0" y="70" class="caption anim" opacity="0">Phase 2: compute P[2]
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;0;0;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </text>
    <text x="0" y="70" class="caption anim" opacity="0">Phase 3: compute P[3]
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;1;0;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </text>
    <text x="0" y="70" class="caption anim" opacity="0">Phase 4: compute P[4]
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;0;1;0;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </text>
    <text x="0" y="70" class="caption anim" opacity="0">Phase 5: compute P[5]
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;0;0;1;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </text>
    <text x="0" y="70" class="caption anim" opacity="0">Phase 6: loop / queries
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;0;0;0;1" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </text>
  </g>
  <!-- Prefix P -->
  <g transform="translate(20,140)">
    <rect class="cell" x="0" y="0" width="60" height="40" stroke="var(--prefix)"/>
    <rect class="cell" x="70" y="0" width="60" height="40" stroke="var(--prefix)"/>
    <rect class="cell" x="140" y="0" width="60" height="40" stroke="var(--prefix)"/>
    <rect class="cell" x="210" y="0" width="60" height="40" stroke="var(--prefix)"/>
    <rect class="cell" x="280" y="0" width="60" height="40" stroke="var(--prefix)"/>
    <rect class="cell" x="350" y="0" width="60" height="40" stroke="var(--prefix)"/>
    <text class="val" x="30" y="24" text-anchor="middle">0</text>
    <text class="val" x="100" y="24" text-anchor="middle">2</text>
    <text class="val" x="170" y="24" text-anchor="middle">1</text>
    <text class="val" x="240" y="24" text-anchor="middle">4</text>
    <text class="val" x="310" y="24" text-anchor="middle">9</text>
    <text class="val" x="380" y="24" text-anchor="middle">13</text>
    <!-- Highlight building of prefix values -->
    <rect class="anim" x="0" y="0" width="60" height="40" fill="rgba(99,102,241,0.18)" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;1;1;1;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </rect>
    <rect class="anim" x="70" y="0" width="60" height="40" fill="rgba(244,114,182,0.18)" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;1;1;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </rect>
    <rect class="anim" x="140" y="0" width="60" height="40" fill="rgba(250,204,21,0.18)" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;1;1;1;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </rect>
    <rect class="anim" x="210" y="0" width="60" height="40" fill="rgba(16,185,129,0.18)" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;0;1;1;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </rect>
    <rect class="anim" x="280" y="0" width="60" height="40" fill="rgba(20,184,166,0.18)" opacity="0">
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;0;0;0;1;0" keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"/>
    </rect>
    <!-- Reduced motion fallback (final prefix state) -->
    <g class="fallback" transform="translate(0,0)">
      <rect x="0" y="0" width="60" height="40" stroke="var(--prefix)" fill="var(--panel)" rx="4" />
      <rect x="70" y="0" width="60" height="40" stroke="var(--prefix)" fill="var(--panel)" rx="4" />
      <rect x="140" y="0" width="60" height="40" stroke="var(--prefix)" fill="var(--panel)" rx="4" />
      <rect x="210" y="0" width="60" height="40" stroke="var(--prefix)" fill="var(--panel)" rx="4" />
      <rect x="280" y="0" width="60" height="40" stroke="var(--prefix)" fill="var(--panel)" rx="4" />
      <rect x="350" y="0" width="60" height="40" stroke="var(--prefix)" fill="var(--panel)" rx="4" />
      <text class="val" x="30" y="24" text-anchor="middle">0</text>
      <text class="val" x="100" y="24" text-anchor="middle">2</text>
      <text class="val" x="170" y="24" text-anchor="middle">1</text>
      <text class="val" x="240" y="24" text-anchor="middle">4</text>
      <text class="val" x="310" y="24" text-anchor="middle">9</text>
      <text class="val" x="380" y="24" text-anchor="middle">13</text>
    </g>
  </g>
  <!-- Legend -->
  <text x="470" y="44" class="caption">
    <tspan x="470" dy="0">Legend:</tspan>
    <tspan x="470" dy="14" fill="#facc15">cursor</tspan>
    <tspan dx="8" fill="#8b5cf6">P[i]</tspan>
  </text>
  <text x="470" y="200" class="caption">Range (1,3)=P[4]-P[1]=9-2=7</text>
</svg>
