<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" font-family="Segoe UI, Arial">
  <style>.bg{fill:#0f172a;} .old { fill:#1e3a8a; stroke:#3b82f6; } .new { fill:#1e3a8a; stroke:#60a5fa; } .empty { fill:#0f172a; stroke:#334155; stroke-dasharray:4 3; } text,.title,.caption,.step,.math { fill:#ffffff; } .caption { font-size:12px; opacity:0.85;} .title { font-size:16px; font-weight:600;} .step { font-size:13px; font-weight:600;} .math { font-size:12px; font-style:italic; }</style>
  <rect class="bg" x="0" y="0" width="760" height="260" rx="10"/>
  <text x="16" y="28" class="title">Dynamic Array Growth (Detailed)</text>
  <text x="16" y="46" class="caption">Resize when size==capacity: allocate larger block, copy, then append new element.</text>
  <g transform="translate(16,80)">
    <text x="0" y="-12" class="step">1. Before (size=4 cap=4)</text>
    <rect class="old" x="0" y="0" width="60" height="50"/>
    <rect class="old" x="60" y="0" width="60" height="50"/>
    <rect class="old" x="120" y="0" width="60" height="50"/>
    <rect class="old" x="180" y="0" width="60" height="50"/>
    <text x="30" y="30" text-anchor="middle">3</text>
    <text x="90" y="30" text-anchor="middle">7</text>
    <text x="150" y="30" text-anchor="middle">1</text>
    <text x="210" y="30" text-anchor="middle">4</text>
  </g>
  <path d="M256 105 L316 105" stroke="#ffffff" marker-end="url(#arrow)" stroke-width="2"/>
  <text x="262" y="92" font-size="12">Copy</text>
  <g transform="translate(316,80)">
    <text x="0" y="-12" class="step">2. New block (cap=8)</text>
    <rect class="new" x="0" y="0" width="60" height="50"/>
    <rect class="new" x="60" y="0" width="60" height="50"/>
    <rect class="new" x="120" y="0" width="60" height="50"/>
    <rect class="new" x="180" y="0" width="60" height="50"/>
    <rect class="empty" x="240" y="0" width="60" height="50"/>
    <rect class="empty" x="300" y="0" width="60" height="50"/>
    <rect class="empty" x="360" y="0" width="60" height="50"/>
    <rect class="empty" x="420" y="0" width="60" height="50"/>
    <text x="30" y="30" text-anchor="middle">3</text>
    <text x="90" y="30" text-anchor="middle">7</text>
    <text x="150" y="30" text-anchor="middle">1</text>
    <text x="210" y="30" text-anchor="middle">4</text>
  </g>
  <path d="M536 105 L596 105" stroke="#ffffff" marker-end="url(#arrow)" stroke-width="2"/>
  <text x="542" y="92" font-size="12">Append</text>
  <g transform="translate(596,80)">
    <text x="0" y="-12" class="step">3. After append (size=5)</text>
    <rect class="new" x="0" y="0" width="60" height="50"/>
    <rect class="new" x="60" y="0" width="60" height="50"/>
    <rect class="new" x="120" y="0" width="60" height="50"/>
    <rect class="new" x="180" y="0" width="60" height="50"/>
    <rect class="new" x="240" y="0" width="60" height="50"/>
    <rect class="empty" x="300" y="0" width="60" height="50"/>
    <rect class="empty" x="360" y="0" width="60" height="50"/>
    <rect class="empty" x="420" y="0" width="60" height="50"/>
    <text x="30" y="30" text-anchor="middle">3</text>
    <text x="90" y="30" text-anchor="middle">7</text>
    <text x="150" y="30" text-anchor="middle">1</text>
    <text x="210" y="30" text-anchor="middle">4</text>
    <text x="270" y="30" text-anchor="middle">9</text>
  </g>
  <g transform="translate(16,180)">
    <text x="0" y="0" class="step">Notes</text>
    <text x="0" y="18" class="caption">Total copies after n appends with doubling &lt; 2n ⇒ amortized O(1).</text>
    <text x="0" y="36" class="caption">Growth factor trade-off: 1.5× fewer spare cells, more frequent resizes.</text>
    <text x="0" y="54" class="caption">Size threshold shrink (e.g. size ≤ cap/4) prevents thrash.</text>
    <text x="0" y="72" class="caption">Pointer/iterator invalidation after reallocation.</text>
    <text x="0" y="90" class="caption">Latency spikes: one expensive resize among cheap appends.</text>
  </g>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffffff"/></marker></defs>
</svg>