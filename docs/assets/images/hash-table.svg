<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="monospace" font-size="14">
  <!-- Background -->
  <rect width="800" height="400" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" fill="#cdd6f4" font-size="18" font-weight="bold" text-anchor="middle">Hash Table — Separate Chaining</text>

  <!-- Bucket labels -->
  <text x="60" y="80" fill="#89b4fa" font-size="13">Buckets</text>
  
  <!-- Buckets 0-7 -->
  <g fill="none" stroke="#585b70" stroke-width="1.5">
    <rect x="30" y="90" width="120" height="35" rx="4"/>
    <rect x="30" y="130" width="120" height="35" rx="4"/>
    <rect x="30" y="170" width="120" height="35" rx="4"/>
    <rect x="30" y="210" width="120" height="35" rx="4"/>
    <rect x="30" y="250" width="120" height="35" rx="4"/>
    <rect x="30" y="290" width="120" height="35" rx="4"/>
    <rect x="30" y="330" width="120" height="35" rx="4"/>
    <rect x="30" y="370" width="120" height="35" rx="4" display="none"/>
  </g>
  
  <!-- Bucket indices -->
  <text x="90" y="113" fill="#6c7086" text-anchor="middle">0</text>
  <text x="90" y="153" fill="#6c7086" text-anchor="middle">1</text>
  <text x="90" y="193" fill="#6c7086" text-anchor="middle">2</text>
  <text x="90" y="233" fill="#a6e3a1" text-anchor="middle">3 ← "apple"</text>
  <text x="90" y="273" fill="#6c7086" text-anchor="middle">4</text>
  <text x="90" y="313" fill="#6c7086" text-anchor="middle">5</text>
  <text x="90" y="353" fill="#fab387" text-anchor="middle">6 ← "banana"</text>

  <!-- Chain for bucket 3 -->
  <rect x="200" y="210" width="130" height="35" rx="4" fill="none" stroke="#a6e3a1" stroke-width="2"/>
  <text x="265" y="233" fill="#a6e3a1" text-anchor="middle">"apple" → 5</text>
  <line x1="330" y1="227" x2="380" y2="227" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="380" y="210" width="140" height="35" rx="4" fill="none" stroke="#f38ba8" stroke-width="2"/>
  <text x="450" y="233" fill="#f38ba8" text-anchor="middle">"cherry" → 9</text>
  <text x="535" y="233" fill="#6c7086">→ null</text>
  
  <!-- Collision label -->
  <text x="420" y="200" fill="#f9e2af" font-size="12" text-anchor="middle">← COLLISION (hash % 8 = 3)</text>

  <!-- Chain for bucket 6 -->
  <rect x="200" y="330" width="140" height="35" rx="4" fill="none" stroke="#fab387" stroke-width="2"/>
  <text x="270" y="353" fill="#fab387" text-anchor="middle">"banana" → 2</text>
  <text x="355" y="353" fill="#6c7086">→ null</text>

  <!-- Arrow from bucket 3 to chain -->
  <line x1="150" y1="227" x2="198" y2="227" stroke="#a6e3a1" stroke-width="2"/>
  <!-- Arrow from bucket 6 to chain -->
  <line x1="150" y1="347" x2="198" y2="347" stroke="#fab387" stroke-width="2"/>

  <!-- Key insight box -->
  <rect x="570" y="80" width="210" height="120" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="675" y="102" fill="#89b4fa" font-size="13" font-weight="bold" text-anchor="middle">Key Properties</text>
  <text x="580" y="122" fill="#cdd6f4" font-size="12">• Average O(1) lookup</text>
  <text x="580" y="142" fill="#cdd6f4" font-size="12">• Keys can be any type</text>
  <text x="580" y="162" fill="#cdd6f4" font-size="12">• Collision → chaining</text>
  <text x="580" y="182" fill="#cdd6f4" font-size="12">• Load factor &lt; 0.75 ideal</text>

  <!-- Hash function box -->
  <rect x="570" y="220" width="210" height="80" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="675" y="242" fill="#a6e3a1" font-size="13" font-weight="bold" text-anchor="middle">Hash Function</text>
  <text x="580" y="265" fill="#cdd6f4" font-size="12">hash("apple") % 8 = 3</text>
  <text x="580" y="285" fill="#cdd6f4" font-size="12">hash("cherry") % 8 = 3 ⚠️</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
  </defs>
</svg>
