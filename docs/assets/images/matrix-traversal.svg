<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="380" height="220" font-family="Segoe UI, Arial">
  <style>.bg{fill:#0f172a;} .cell{fill:#334155;stroke:#64748b;} text, .title, .lab { fill:#ffffff; } .title{font-size:16px;font-weight:600;} .lab{font-size:12px;opacity:0.85;}</style>
  <rect class="bg" x="0" y="0" width="380" height="220" rx="8"/>
  <text x="16" y="28" class="title">Matrix Traversal (Row-Major)</text>
  <text x="16" y="46" font-size="12">Left→Right across row then next row; cache-friendly in row-major memory.</text>
  <g transform="translate(16,70)">
    <rect class="cell" x="0" y="0" width="50" height="50"/>
    <rect class="cell" x="50" y="0" width="50" height="50"/>
    <rect class="cell" x="100" y="0" width="50" height="50"/>
    <rect class="cell" x="0" y="50" width="50" height="50"/>
    <rect class="cell" x="50" y="50" width="50" height="50"/>
    <rect class="cell" x="100" y="50" width="50" height="50"/>
    <rect class="cell" x="0" y="100" width="50" height="50"/>
    <rect class="cell" x="50" y="100" width="50" height="50"/>
    <rect class="cell" x="100" y="100" width="50" height="50"/>
    <text x="25" y="30" text-anchor="middle">1</text>
    <text x="75" y="30" text-anchor="middle">4</text>
    <text x="125" y="30" text-anchor="middle">7</text>
    <text x="25" y="80" text-anchor="middle">2</text>
    <text x="75" y="80" text-anchor="middle">5</text>
    <text x="125" y="80" text-anchor="middle">8</text>
    <text x="25" y="130" text-anchor="middle">3</text>
    <text x="75" y="130" text-anchor="middle">6</text>
    <text x="125" y="130" text-anchor="middle">9</text>
  </g>
  <path d="M51 85 L91 85 L131 85 L131 135 L91 135 L51 135 L51 185 L131 185" stroke="#38bdf8" fill="none" marker-end="url(#arrow)" stroke-width="2"/>
  <text x="180" y="140" font-size="12">Traversal path</text>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/></marker></defs>
  <text x="16" y="200" font-size="12">Column-major iteration would zig-zag differently</text>
</svg>