<svg width="700" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #ffffff; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; fill: #f8f9fa; font-weight: bold; }
      .node { fill: #3498db; stroke: #2980b9; stroke-width: 2; rx: 5; }
      .node-text { font-family: Arial, sans-serif; font-size: 12px; fill: white; font-weight: bold; }
      .pointer { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .desc { font-family: Arial, sans-serif; font-size: 12px; fill: #f1f2f6; }
      .null { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#e74c3c"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="350" y="30" class="title" text-anchor="middle">Linked List Data Structure</text>
  <text x="350" y="55" class="subtitle" text-anchor="middle">Nodes connected through pointers</text>
  
  <!-- Head pointer -->
  <text x="50" y="120" class="desc">HEAD</text>
  <line x1="80" y1="115" x2="120" y2="115" class="pointer"/>
  
  <!-- Node 1 -->
  <rect x="130" y="100" width="60" height="30" class="node"/>
  <line x1="160" y1="100" x2="160" y2="130" stroke="#2980b9" stroke-width="1"/>
  <text x="145" y="120" class="node-text" text-anchor="middle">10</text>
  <text x="175" y="120" class="node-text" text-anchor="middle">→</text>
  
  <!-- Pointer 1 -->
  <line x1="190" y1="115" x2="230" y2="115" class="pointer"/>
  
  <!-- Node 2 -->
  <rect x="240" y="100" width="60" height="30" class="node"/>
  <line x1="270" y1="100" x2="270" y2="130" stroke="#2980b9" stroke-width="1"/>
  <text x="255" y="120" class="node-text" text-anchor="middle">25</text>
  <text x="285" y="120" class="node-text" text-anchor="middle">→</text>
  
  <!-- Pointer 2 -->
  <line x1="300" y1="115" x2="340" y2="115" class="pointer"/>
  
  <!-- Node 3 -->
  <rect x="350" y="100" width="60" height="30" class="node"/>
  <line x1="380" y1="100" x2="380" y2="130" stroke="#2980b9" stroke-width="1"/>
  <text x="365" y="120" class="node-text" text-anchor="middle">30</text>
  <text x="395" y="120" class="node-text" text-anchor="middle">→</text>
  
  <!-- Pointer 3 -->
  <line x1="410" y1="115" x2="450" y2="115" class="pointer"/>
  
  <!-- Node 4 -->
  <rect x="460" y="100" width="60" height="30" class="node"/>
  <line x1="490" y1="100" x2="490" y2="130" stroke="#2980b9" stroke-width="1"/>
  <text x="475" y="120" class="node-text" text-anchor="middle">45</text>
  <text x="505" y="120" class="node-text" text-anchor="middle">→</text>
  
  <!-- Null pointer -->
  <rect x="540" y="110" width="30" height="10" class="null"/>
  <text x="555" y="120" class="node-text" text-anchor="middle" font-size="10">NULL</text>
  <line x1="520" y1="115" x2="535" y2="115" class="pointer"/>
  
  <!-- Labels -->
  <text x="160" y="150" class="desc" text-anchor="middle" font-size="10">Data | Next</text>
  <text x="270" y="150" class="desc" text-anchor="middle" font-size="10">Data | Next</text>
  <text x="380" y="150" class="desc" text-anchor="middle" font-size="10">Data | Next</text>
  <text x="490" y="150" class="desc" text-anchor="middle" font-size="10">Data | Next</text>
  
  <!-- Properties -->
  <text x="50" y="200" class="desc" font-weight="bold">Characteristics:</text>
  <text x="50" y="220" class="desc">✓ Dynamic size</text>
  <text x="200" y="220" class="desc">✓ Efficient insertion/deletion</text>
  <text x="420" y="220" class="desc">✗ No random access</text>
  <text x="50" y="240" class="desc">✓ Memory efficient</text>
  <text x="200" y="240" class="desc">✗ Sequential access O(n)</text>
  <text x="420" y="240" class="desc">✗ Extra memory for pointers</text>
  
  <!-- Operations -->
  <text x="350" y="200" class="desc" text-anchor="middle" font-weight="bold">Common Operations:</text>
  <text x="300" y="270" class="desc" text-anchor="middle">Insert at head: O(1) | Insert at tail: O(n) | Search: O(n) | Delete: O(n)</text>
</svg>