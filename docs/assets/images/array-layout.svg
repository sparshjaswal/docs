<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140" font-family="Segoe UI, Arial">
  <style>
    .bg { fill:#0f172a; }
    .cell { fill:#1e3a8a; stroke:#3b82f6; }
    text, .idx, .val, .title, .caption { fill:#ffffff; }
    .idx { font-size:12px; }
    .val { font-size:14px; font-weight:600; }
    .title { font-size:16px; font-weight:600; }
    .caption { font-size:12px; opacity:0.85; }
  </style>
  <rect class="bg" x="0" y="0" width="500" height="140" rx="8"/>
  <text x="16" y="28" class="title">Array (Contiguous Memory)</text>
  <text x="16" y="46" class="caption">Address = base + index × element_size (O(1) random access)</text>
  <g transform="translate(10,60)">
    <rect class="cell" x="0" y="0" width="60" height="40"/>
    <rect class="cell" x="60" y="0" width="60" height="40"/>
    <rect class="cell" x="120" y="0" width="60" height="40"/>
    <rect class="cell" x="180" y="0" width="60" height="40"/>
    <rect class="cell" x="240" y="0" width="60" height="40"/>
    <text class="val" x="30" y="25" text-anchor="middle">3</text>
    <text class="val" x="90" y="25" text-anchor="middle">7</text>
    <text class="val" x="150" y="25" text-anchor="middle">1</text>
    <text class="val" x="210" y="25" text-anchor="middle">4</text>
  <text class="val" x="270" y="25" text-anchor="middle">9</text>
  <text class="idx" x="30" y="55" text-anchor="middle">0</text>
    <text class="idx" x="90" y="55" text-anchor="middle">1</text>
    <text class="idx" x="150" y="55" text-anchor="middle">2</text>
    <text class="idx" x="210" y="55" text-anchor="middle">3</text>
    <text class="idx" x="270" y="55" text-anchor="middle">4</text>
  </g>
  <text x="320" y="78" font-size="12" fill="#ffffff">Cache-friendly sequential iteration</text>
</svg>