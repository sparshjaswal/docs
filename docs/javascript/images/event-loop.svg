<svg xmlns="http://www.w3.org/2000/svg" width="880" height="880" viewBox="0 0 880 880" role="img" aria-labelledby="title desc">
  <title id="title">How the browser schedules JavaScript</title>
  <desc id="desc">The call stack runs synchronous JavaScript. Calling setTimeout registers a timer with the browser; once eligible, its callback becomes a task. Promise reactions and queueMicrotask callbacks enter the microtask queue. At a checkpoint, microtasks run on the JavaScript stack until the queue is empty. Rendering may occur at an opportunity, then another runnable task is selected. The example logs A and B synchronously, C as a microtask, then D as a timer task. Browser task queues are shown as one conceptual group, not one universal FIFO queue.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #172b4d; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 18px; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 20px; }
      .path { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="880" height="880" rx="24" fill="#f7f9fc"/>
  <text x="40" y="51" font-size="32" font-weight="750">The browser event loop</text>
  <text x="40" y="82" class="body" fill="#52627a">Follow the work: run now → queue for later → take a turn</text>

  <!-- Execution and host facilities are separate responsibilities. -->
  <rect x="60" y="122" width="320" height="218" rx="16" fill="#eff6ff" stroke="#93b4ee" stroke-width="2"/>
  <text x="82" y="157" class="label">CALL STACK</text>
  <text x="82" y="187" class="body">JavaScript executes here</text>
  <rect x="82" y="207" width="276" height="47" rx="8" fill="#2563eb"/>
  <text x="102" y="237" class="code" style="fill: white">current function()</text>
  <rect x="82" y="262" width="276" height="47" rx="8" fill="#dbeafe"/>
  <text x="102" y="292" class="code">caller / script</text>

  <rect x="500" y="122" width="320" height="218" rx="16" fill="#fff7ed" stroke="#e7b778" stroke-width="2"/>
  <text x="522" y="157" class="label">BROWSER / HOST APIs</text>
  <text x="522" y="195" class="body">Track timers and I/O</text>
  <text x="522" y="232" class="code">setTimeout(fn, 0)</text>
  <text x="522" y="270" class="body">Wait for the timer's</text>
  <text x="522" y="297" class="body">delay conditions.</text>

  <path d="M380 228 H495" class="path" stroke="#b45309" marker-end="url(#amber-arrow)"/>
  <text x="440" y="190" class="small" text-anchor="middle">register</text>
  <text x="440" y="212" class="small" text-anchor="middle">timer</text>

  <!-- These arrows describe enqueueing, not executing a callback. -->
  <path d="M220 340 V420" class="path" stroke="#047857" marker-end="url(#green-arrow)"/>
  <rect x="78" y="359" width="284" height="44" rx="7" fill="#f7f9fc"/>
  <text x="220" y="378" class="small" text-anchor="middle">queueMicrotask / ready</text>
  <text x="220" y="400" class="small" text-anchor="middle">promise reaction</text>
  <path d="M660 340 V420" class="path" stroke="#b45309" marker-end="url(#amber-arrow)"/>
  <rect x="563" y="365" width="194" height="30" rx="7" fill="#f7f9fc"/>
  <text x="660" y="387" class="small" text-anchor="middle">when eligible</text>

  <rect x="60" y="426" width="320" height="128" rx="16" fill="#ecfdf5" stroke="#76c5a4" stroke-width="2"/>
  <text x="82" y="461" class="label">MICROTASK QUEUE</text>
  <rect x="82" y="480" width="276" height="48" rx="8" fill="#d1fae5"/>
  <text x="100" y="511" class="code">C: .then(callback)</text>

  <rect x="500" y="426" width="320" height="128" rx="16" fill="#fff7ed" stroke="#e7b778" stroke-width="2"/>
  <text x="522" y="461" class="label">TASK QUEUES</text>
  <rect x="522" y="480" width="276" height="48" rx="8" fill="#ffedd5"/>
  <text x="540" y="511" class="code">D: timer callback</text>

  <path d="M220 554 V601" class="path" stroke="#047857" marker-end="url(#green-arrow)"/>
  <path d="M660 554 V601" class="path" stroke="#b45309" marker-end="url(#amber-arrow)"/>

  <!-- The return path emphasizes that queued JavaScript uses the same stack. -->
  <rect x="60" y="608" width="760" height="150" rx="16" fill="#172b4d"/>
  <text x="82" y="643" class="label" style="fill: white">AFTER THE CURRENT SYNCHRONOUS WORK</text>
  <text x="82" y="676" class="body" style="fill: #a7f3d0">1  At a checkpoint, drain microtasks — including new ones.</text>
  <text x="82" y="707" class="body" style="fill: white">2  Render if there is an opportunity.</text>
  <text x="82" y="738" class="body" style="fill: #fed7aa">3  Select another runnable task. Its callback uses the stack.</text>
  <path d="M60 719 H26 V232 H55" class="path" stroke="#2563eb" marker-end="url(#blue-arrow)"/>

  <text x="60" y="804" class="label">EXAMPLE ORDER</text>
  <text x="290" y="804" class="code">A → B → C → D</text>
  <text x="60" y="836" class="small">A + B: synchronous   ·   C: microtask   ·   D: later timer task</text>
  <text x="60" y="863" font-size="16" fill="#52627a">Simplified browser model. Multiple task queues; rendering is not guaranteed each turn.</text>
</svg>
