
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="bsTitle bsDesc" aria-describedby="bsLegend" shape-rendering="crispEdges">
  <title id="bsTitle">Enhanced Binary Search Animation</title>
  <desc id="bsDesc">Interactive binary search with smooth transitions, enhanced visuals, and educational annotations.</desc>
  
  <defs>
    <linearGradient id="cellGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="targetGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <style>
    :root { 
      --bg: #0f172a; --panel: #1e293b; --border: #475569; --txt: #ffffff; 
      --cap: #94a3b8; --lo: #3b82f6; --hi: #ec4899; --mid: #f59e0b; 
      --target: #10b981; --found: #22c55e; --discard: #ef4444;
      --phase1: #6366f1; --phase2: #8b5cf6; --phase3: #06b6d4; --phase4: #10b981;
    }
    text { font-family: 'SF Pro Display', 'Inter', Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: var(--txt); }
    .subtitle { font-size: 14px; font-weight: 500; fill: var(--cap); }
    .caption { font-size: 13px; fill: var(--cap); }
    .cell { stroke: var(--border); stroke-width: 1.5; fill: url(#cellGradient); rx: 6; }
    .cell.highlight { stroke: var(--target); stroke-width: 2; filter: url(#glow); }
    .val { font-size: 14px; font-weight: 600; fill: var(--txt); text-anchor: middle; }
    .ptr { font-size: 13px; font-weight: 700; }
    .ptr.lo { fill: var(--lo); }
    .ptr.hi { fill: var(--hi); }
    .ptr.mid { fill: var(--mid); }
    .target-label { font-size: 13px; font-weight: 700; fill: var(--target); }
    .step-label { font-size: 12px; font-weight: 600; fill: var(--txt); text-anchor: middle; }
    .phase-desc { font-size: 12px; font-weight: 500; fill: var(--cap); }
    .comparison { font-size: 11px; font-weight: 600; fill: var(--txt); text-anchor: middle; }
    @media (prefers-reduced-motion: reduce) { .anim { display: none; } .fallback { display: block; } }
    .fallback { display: none; }
  </style>
  
  <!-- Background -->
  <rect x="0" y="0" width="900" height="280" fill="var(--bg)" />
  
  <!-- Header -->
  <rect x="0" y="0" width="900" height="70" fill="var(--panel)" filter="url(#shadow)" />
  <text x="30" y="30" class="title">Enhanced Binary Search Visualization</text>
  <text x="30" y="50" class="subtitle">Target: 30 | Array: [3, 7, 12, 18, 21, 27, 30, 34, 39] | Time: O(log n)</text>
  
  <!-- Main Animation Area -->
  <g transform="translate(30,90)">
    <!-- Array Cells with Enhanced Styling -->
    <g id="array-cells">
      <rect class="cell" x="0" y="0" width="70" height="45" />
      <rect class="cell" x="80" y="0" width="70" height="45" />
      <rect class="cell" x="160" y="0" width="70" height="45" />
      <rect class="cell" x="240" y="0" width="70" height="45" />
      <rect class="cell" x="320" y="0" width="70" height="45" />
      <rect class="cell" x="400" y="0" width="70" height="45" />
      <rect class="cell" x="480" y="0" width="70" height="45" />
      <rect class="cell" x="560" y="0" width="70" height="45" />
      <rect class="cell" x="640" y="0" width="70" height="45" />
      
      <!-- Values -->
      <text class="val" x="35" y="28">3</text>
      <text class="val" x="115" y="28">7</text>
      <text class="val" x="195" y="28">12</text>
      <text class="val" x="275" y="28">18</text>
      <text class="val" x="355" y="28">21</text>
      <text class="val" x="435" y="28">27</text>
      <text class="val" x="515" y="28">30</text>
      <text class="val" x="595" y="28">34</text>
      <text class="val" x="675" y="28">39</text>
    </g>
    
    <!-- Discard Overlay with Smooth Animation -->
    <rect id="discard-overlay" class="anim" x="0" y="0" width="390" height="45" rx="6" 
          fill="var(--discard)" opacity="0" filter="url(#shadow)">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" 
               values="0;0;0;0.4;0.4;0.4;0.4;0" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
    </rect>
    
    <!-- Enhanced Pointers with Smooth Movement -->
    <g id="pointers">
      <!-- Low Pointer -->
      <text class="ptr lo anim" id="lo-ptr" x="0" y="-15">low
        <animate attributeName="x" dur="12s" repeatCount="indefinite" 
                 values="0;0;0;400;400;400;400;0" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
      </text>
      
      <!-- High Pointer -->
      <text class="ptr hi" x="640" y="-15">high</text>
      
      <!-- Mid Pointer with Enhanced Animation -->
      <text class="ptr mid anim" id="mid-ptr" x="320" y="70">mid
        <animate attributeName="x" dur="12s" repeatCount="indefinite" 
                 values="320;320;320;320;480;480;480;320" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
      </text>
    </g>
    
    <!-- Target Indicator -->
    <text class="target-label" x="515" y="70">🎯 target</text>
    
    <!-- Found Animation with Enhanced Effects -->
    <circle id="found-ring" class="anim" cx="515" cy="22" r="25" 
            stroke="var(--found)" stroke-width="3" fill="none" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" 
               values="0;0;0;0;0;0;1;0" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
      <animate attributeName="r" dur="12s" repeatCount="indefinite" 
               values="25;25;25;25;25;25;35;25" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
      <animate attributeName="stroke-width" dur="12s" repeatCount="indefinite" 
               values="3;3;3;3;3;3;1;3" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
    </circle>
    
    <!-- Comparison Indicators -->
    <text class="comparison anim" x="355" y="90" opacity="0">mid < target
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" 
               values="0;0;1;1;0;0;0;0" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
    </text>
    <text class="comparison anim" x="515" y="90" opacity="0">mid = target ✓
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" 
               values="0;0;0;0;0;1;1;0" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
    </text>
    
    <!-- Phase Descriptions with Enhanced Styling -->
    <rect id="phase-box" class="anim" x="750" y="-20" width="140" height="40" rx="8" 
          fill="var(--phase1)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)">
      <animate attributeName="fill" dur="12s" repeatCount="indefinite" 
               values="var(--phase1);var(--phase1);var(--phase2);var(--phase3);var(--phase4);var(--phase4);var(--phase1);var(--phase1)" 
               keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
    </rect>
    
    <text class="step-label anim" x="820" y="5">Initialize
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" 
               values="1;1;0;0;0;0;0;1" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
    </text>
    <text class="step-label anim" x="820" y="5" opacity="0">Compare
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" 
               values="0;0;1;0;0;0;0;0" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
    </text>
    <text class="step-label anim" x="820" y="5" opacity="0">Discard Left
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" 
               values="0;0;0;1;0;0;0;0" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
    </text>
    <text class="step-label anim" x="820" y="5" opacity="0">Found Target!
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" 
               values="0;0;0;0;1;1;0;0" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
    </text>
    
    <!-- Detailed Phase Descriptions -->
    <text class="phase-desc anim" x="0" y="120" opacity="1">Phase 1: Initialize low=0, high=8, mid=4
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" 
               values="1;1;0;0;0;0;0;0" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
    </text>
    <text class="phase-desc anim" x="0" y="120" opacity="0">Phase 2: Compare arr[4]=21 with target=30 → 21 < 30
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" 
               values="0;0;1;0;0;0;0;0" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
    </text>
    <text class="phase-desc anim" x="0" y="120" opacity="0">Phase 3: Discard left half, set low=5, recalculate mid=6
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" 
               values="0;0;0;1;0;0;0;0" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
    </text>
    <text class="phase-desc anim" x="0" y="120" opacity="0">Phase 4: Compare arr[6]=30 with target=30 → Match found! 🎉
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" 
               values="0;0;0;0;1;1;0;0" keyTimes="0;0.2;0.3;0.4;0.6;0.7;0.8;1" />
    </text>
  </g>
  
  <!-- Enhanced Legend -->
  <g transform="translate(30,220)">
    <rect x="0" y="0" width="840" height="50" rx="8" fill="var(--panel)" stroke="var(--border)" filter="url(#shadow)" />
    <text x="20" y="20" class="caption" style="font-weight: 600;">Legend:</text>
    <circle cx="80" cy="15" r="6" fill="var(--lo)" />
    <text x="95" y="20" class="caption">Low Pointer</text>
    <circle cx="200" cy="15" r="6" fill="var(--hi)" />
    <text x="215" y="20" class="caption">High Pointer</text>
    <circle cx="320" cy="15" r="6" fill="var(--mid)" />
    <text x="335" y="20" class="caption">Mid Pointer</text>
    <circle cx="440" cy="15" r="6" fill="var(--target)" />
    <text x="455" y="20" class="caption">Target</text>
    <rect x="520" y="10" width="20" height="10" fill="var(--discard)" opacity="0.4" />
    <text x="550" y="20" class="caption">Discarded Region</text>
    
    <text x="20" y="40" class="caption" style="font-style: italic;">Time Complexity: O(log n) | Space Complexity: O(1) | Each step eliminates half the search space</text>
  </g>
  
  <!-- Fallback for Reduced Motion -->
  <g class="fallback" transform="translate(30,90)">
    <rect class="cell" x="0" y="0" width="70" height="45" />
    <rect class="cell" x="80" y="0" width="70" height="45" />
    <rect class="cell" x="160" y="0" width="70" height="45" />
    <rect class="cell" x="240" y="0" width="70" height="45" />
    <rect class="cell" x="320" y="0" width="70" height="45" />
    <rect class="cell" x="400" y="0" width="70" height="45" />
    <rect class="cell highlight" x="480" y="0" width="70" height="45" />
    <rect class="cell" x="560" y="0" width="70" height="45" />
    <rect class="cell" x="640" y="0" width="70" height="45" />
    
    <text class="val" x="35" y="28">3</text>
    <text class="val" x="115" y="28">7</text>
    <text class="val" x="195" y="28">12</text>
    <text class="val" x="275" y="28">18</text>
    <text class="val" x="355" y="28">21</text>
    <text class="val" x="435" y="28">27</text>
    <text class="val" x="515" y="28">30</text>
    <text class="val" x="595" y="28">34</text>
    <text class="val" x="675" y="28">39</text>
    
    <text class="ptr lo" x="400" y="-15">low</text>
    <text class="ptr hi" x="640" y="-15">high</text>
    <text class="ptr mid" x="480" y="70">mid</text>
    <text class="target-label" x="515" y="70">🎯 target</text>
    <circle cx="515" cy="22" r="30" stroke="var(--found)" stroke-width="3" fill="none" />
  </g>
</svg>